<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamentic on Anna · Architecture</title>
<meta name="description" content="One architecture graph for Gamentic running as an Anna App: the Anna host LLM, the per-turn narrator and its toolset, world state, and the stackable player turn.">
<style>
  :root {
    --bg:#070807; --surface:#101210; --surface-2:#151814; --surface-3:#1d211c;
    --line:#30362d; --line-soft:#222720; --text:#eef2e8; --muted:#aab4a3; --faint:#707b69;
    --green:#65d08b; --cyan:#62c8d8; --amber:#e7b75f; --pink:#e47ea5; --violet:#a895f2; --red:#ef756f; --blue:#7ba7ff; --orange:#f0975a; --teal:#5fd6c2;
    --shadow:rgba(0,0,0,.55);
  }
  * { box-sizing:border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body {
    background:var(--bg); color:var(--text);
    font:13px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  a { color:var(--cyan); }

  #app { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr; }

  /* ---------- title bar ---------- */
  .topbar {
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:11px 16px; border-bottom:1px solid var(--line); background:rgba(11,13,10,.9);
  }
  .brand { display:flex; align-items:baseline; gap:10px; min-width:0; }
  .brand .eyebrow { color:var(--faint); text-transform:uppercase; letter-spacing:2px; font-size:10px; font-weight:800; }
  .brand h1 { margin:0; font-size:15px; letter-spacing:.2px; white-space:nowrap; }
  .brand .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #stage {
    position:relative; min-width:0; min-height:0; overflow:hidden;
    background:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px), var(--bg);
    background-size:36px 36px;
  }

  /* graph */
  #chart { width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #chart.dragging { cursor:grabbing; }
  .legend { position:absolute; left:16px; top:14px; z-index:3; display:flex; flex-wrap:wrap; gap:7px; max-width:60%; pointer-events:none; }
  .pill { display:inline-flex; gap:6px; align-items:center; padding:5px 8px; border:1px solid var(--line); border-radius:999px;
          background:rgba(16,18,16,.82); color:var(--muted); font-size:11px; box-shadow:0 10px 28px var(--shadow); }
  .dot { width:8px; height:8px; border-radius:99px; display:inline-block; }
  .controls { position:absolute; left:16px; bottom:14px; display:flex; gap:8px; z-index:3; }
  button.ctl { border:1px solid var(--line); background:rgba(16,18,16,.9); color:var(--text); border-radius:8px;
               padding:8px 10px; font:650 11px ui-sans-serif,system-ui,sans-serif; cursor:pointer; }
  button.ctl:hover { background:var(--surface-2); border-color:#46513f; }

  #tip { position:absolute; z-index:6; width:min(320px,calc(100vw - 24px)); display:none; border:1px solid #3a4435;
         border-radius:9px; padding:9px 10px; background:rgba(9,11,9,.97); box-shadow:0 18px 42px var(--shadow); color:var(--muted); pointer-events:none; }
  #tip strong { display:block; margin-bottom:4px; color:var(--text); font-size:12px; }
  #tip p { margin:0; }

  .node rect.main { stroke-width:1.3; rx:12; filter:drop-shadow(0 10px 18px rgba(0,0,0,.42)); }
  .node text { user-select:none; pointer-events:none; }
  .node .label { font-weight:760; font-size:13px; fill:var(--text); }
  .node .sub { font-size:11px; fill:var(--muted); }
  .node .kind { font-size:9px; font-weight:850; letter-spacing:1.1px; text-transform:uppercase; }
  .node.selected rect.main { stroke-width:2.6; }
  .node.dim { opacity:.26; }
  .node.connected { opacity:1; }
  .node { cursor:pointer; }
  .edge { fill:none; stroke-width:2.1; stroke-linecap:round; opacity:.5; cursor:pointer; }
  .edge.dim { opacity:.12; }
  .edge.selected { opacity:1; stroke-width:3.4; }
  .edgePort { fill:rgba(7,8,7,.88); stroke-width:1.6; pointer-events:none; }
  .edgePort.dim { opacity:.12; }
  .edgePortText { fill:var(--faint); font:8px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-transform:uppercase;
                  letter-spacing:.4px; paint-order:stroke; stroke:rgba(7,8,7,.9); stroke-width:3px; pointer-events:none; user-select:none; }
  .edgePortText.dim { opacity:.12; }
  .edgeLabel { font-size:10px; fill:var(--muted); opacity:.66; paint-order:stroke; stroke:rgba(7,8,7,.82); stroke-width:4px;
               stroke-linejoin:round; pointer-events:none; user-select:none; }
  .edgeLabel.hidden { opacity:0; }
  .edgeLabel.dim { opacity:.16; }
  .laneLabel { font-size:11px; font-weight:850; letter-spacing:1.2px; text-transform:uppercase; fill:var(--faint); pointer-events:none; }
  .laneLine { stroke:rgba(170,180,163,.16); stroke-width:1; stroke-dasharray:5 8; pointer-events:none; }
  .helpBtn rect { fill:rgba(7,8,7,.72); stroke:var(--line); rx:6; }
  .helpBtn text { font:850 8px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; pointer-events:none; }
  .helpBtn:hover rect { stroke:#64715d; fill:rgba(24,28,22,.95); }

  /* click-to-open detail panel: hidden until a node/edge is clicked, then covers 50% */
  #panel {
    position:absolute; top:0; right:0; bottom:0; width:50%;
    background:rgba(11,13,10,.98); border-left:1px solid var(--line); box-shadow:-26px 0 60px var(--shadow);
    transform:translateX(101%); transition:transform .18s ease; z-index:7;
    display:grid; grid-template-rows:auto 1fr; min-height:0;
  }
  #panel.open { transform:translateX(0); }
  .panelHead { padding:15px 17px 13px; border-bottom:1px solid var(--line); }
  .panelTop { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .panelHead .eyebrow { color:var(--faint); text-transform:uppercase; letter-spacing:1px; font-size:10px; font-weight:800; }
  .panelHead h3 { margin:5px 0 0; font-size:16px; line-height:1.2; }
  .panelHead p { margin:7px 0 0; color:var(--muted); font-size:12px; }
  .closeX { flex:0 0 auto; border:1px solid var(--line); background:rgba(16,18,16,.9); color:var(--text);
            border-radius:7px; padding:5px 9px; font:700 12px ui-sans-serif,system-ui,sans-serif; cursor:pointer; }
  .closeX:hover { background:var(--surface-2); border-color:#46513f; }
  #panelBody { overflow:auto; min-height:0; padding:14px 17px 24px; }

  /* shared content blocks (panel) */
  .section { margin:0 0 14px; padding:12px; border:1px solid var(--line-soft); background:rgba(21,24,20,.74); border-radius:10px; }
  .section h3 { margin:0 0 8px; color:var(--text); font-size:11px; text-transform:uppercase; letter-spacing:.9px; }
  .section p { margin:0; color:var(--muted); }
  ul { margin:0; padding-left:17px; color:var(--muted); } li { margin:3px 0; }
  .code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:#d9e5d1; }
  .jsonbox { margin:0; padding:10px; overflow:visible; border:1px solid #2b3329; border-radius:8px; background:#090b09;
             color:#d9e5d1; font:11px/1.48 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; tab-size:2; white-space:pre-wrap; word-break:break-word; }
  .jsonbox .jkey{color:var(--green)} .jsonbox .jstr{color:var(--amber)} .jsonbox .jnum{color:var(--cyan)}
  .jsonbox .jbool{color:var(--violet)} .jsonbox .jnull{color:var(--red)} .jsonbox .jobj{color:#8fdc89;font-weight:800} .jsonbox .jarr{color:#78d4e2;font-weight:800}
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; border:1px solid var(--line); border-radius:7px; padding:3px 7px; color:var(--muted);
          background:rgba(0,0,0,.16); font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }

  @media (max-width:820px) {
    #panel { width:88%; }
    .legend { display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="eyebrow">Gamentic on Anna</div>
      <h1>Architecture</h1>
    </div>
    <div class="brand"><span class="sub">Drag to pan · wheel to zoom · click a node for detail</span></div>
  </div>
  <div id="stage">
    <div class="legend" id="legend"></div>
    <svg id="chart" role="img" aria-label="Gamentic on Anna architecture"><defs id="defs"></defs>
      <g id="viewport"><g id="lanes"></g><g id="edges"></g><g id="labels"></g><g id="nodes"></g></g>
    </svg>
    <div class="controls" id="controls"><button class="ctl" id="fit">Fit</button><button class="ctl" id="reset">Reset</button></div>
    <div id="tip"></div>
    <aside id="panel">
      <div class="panelHead">
        <div class="panelTop"><div class="eyebrow" id="pKind">node</div><button class="closeX" id="pClose">Close ✕</button></div>
        <h3 id="pTitle"></h3><p id="pSummary"></p>
      </div>
      <div id="panelBody"></div>
    </aside>
  </div>
</div>

<script>
/* =====================================================================
   DATA - one graph: Gamentic running as an Anna App.
   Schema matches the docs renderer exactly:
     node:  { id, kind, label, sub, summary, note, x, y, w, h }
     edge:  { from, to, kind, label, detail }
     group: { id, label, nodeIds }
     section: { nodes, edges, groups, legend, home, view,
                C (kind->stroke), NODE_FILL (kind->fill), EDGE_KIND (kind->edge color), FLOW_KIND }
   ===================================================================== */
const SECTION = {
  id:"arch",
  view:"graph",
  home:{x:40,y:30,k:.46},
  // kind -> node stroke color
  C:{
    anna:"var(--blue)", image:"var(--violet)", turn:"var(--amber)", tool:"var(--cyan)",
    scene:"var(--green)", character:"var(--green)", contains:"var(--teal)", talks:"var(--pink)",
    flow:"var(--orange)", call:"var(--cyan)", feed:"var(--green)", cue:"var(--amber)", write:"var(--violet)"
  },
  // kind -> node fill
  NODE_FILL:{
    anna:"#111521", image:"#161322", turn:"#171410", tool:"#101718",
    scene:"#121812", character:"#121812", contains:"#101716", talks:"#181117",
    flow:"#1a140f", call:"#101718", feed:"#121812", cue:"#171410", write:"#161322"
  },
  // edge kind -> stroke color
  EDGE_KIND:{
    anna:"var(--blue)", image:"var(--violet)", tool:"var(--cyan)", write:"var(--violet)",
    contains:"var(--teal)", talks:"var(--pink)", flow:"var(--orange)", feed:"var(--green)", cue:"var(--amber)"
  },
  FLOW_KIND:"flow",   // edges of this kind keep their labels visible
  legend:[
    {color:"var(--blue)",label:"anna"},
    {color:"var(--violet)",label:"image"},
    {color:"var(--amber)",label:"turn / cue"},
    {color:"var(--cyan)",label:"tool / call"},
    {color:"var(--green)",label:"scene / character / feed"},
    {color:"var(--teal)",label:"contains"},
    {color:"var(--pink)",label:"talks"},
    {color:"var(--orange)",label:"flow"}
  ],
  groups:[
    {id:"grp-host",   label:"Anna host",               nodeIds:["annaText","annaImage"]},
    {id:"grp-turn",   label:"Turn brain",              nodeIds:["narrator","tools"]},
    {id:"grp-world",  label:"World state",             nodeIds:["quests","scene","character","items","exits","sceneActions","inventory","characterActions","whisper","memory","backstory","traits","events"]},
    {id:"grp-action", label:"Player turn", nodeIds:["actions","say","do","look","custom"]}
  ],
  nodes:[
    // --- Anna host (top-left column) ---
    { id:"annaText", kind:"anna", label:"LLM Backend · Anna", sub:"host model (sampling/createMessage)",
      x:40, y:40, w:300, h:84,
      summary:"Anna's host LLM. The engine reverse-RPCs sampling/createMessage for every token: narration, dialogue, world creation, and the freeform interpreter. Anna owns the model, billing, and quota.",
      note:"All text generation is reverse-RPC'd to the Anna host over the executa channel; the engine never ships a model of its own." },
    { id:"annaImage", kind:"image", label:"LLM Backend · Anna Image", sub:"host image model (image/generate)",
      x:40, y:170, w:300, h:84,
      summary:"Anna's host image model (image/generate): scene art, character portraits, item cards. Off by default on the Anna build (a render exceeds the 65s invoke cap).",
      note:"Disabled by default on the Anna build: a single render exceeds Anna's 65s invoke cap, so image tools are not offered unless explicitly enabled." },

    // --- Turn brain (center column) ---
    { id:"narrator", kind:"turn", label:"Narrator", sub:"per-turn brain",
      x:470, y:60, w:290, h:84,
      summary:"The per-turn brain. Reads full world state + recap + lore + the player's composed action, writes second-person prose, and drives every state change through its toolset. Cues characters to speak rather than voicing them.",
      note:"One narrator pass per turn; it adjudicates the player's action and emits prose plus tool calls. It directs characters via cue rather than speaking their lines." },
    { id:"tools", kind:"tool", label:"Narrator toolset · up to 37 tools", sub:"the only way fiction becomes state",
      x:300, y:300, w:300, h:92,
      summary:"How fiction becomes state: spawn/cue characters, move/describe scenes, add exits, place/give items, reveal origin, note traits, set following/relation, request images, veto attempts. Tools (37): apply_damage, heal, add_item, remove_item, award_points, start_quest, update_objective, complete_quest, fail_quest, move_location, set_flag, remember, cue_character, spawn_character, kill_character, set_disposition, set_following, set_scene_status, set_game_status, describe_scene, describe_character, set_goal, add_exit, place_item, reveal_item, take_item, offer_action, offer_scene_action, give_item, note_trait, note_scene, advance_time, reveal_origin, note_moment, set_relation, plus reject_attempt (veto) and show_image (request images).",
      note:"35 base tools in a fixed schema order, plus reject_attempt (offered only while attempts are pending) and show_image (offered only when images are on): up to 37. The toolset is the model's only sanctioned way to change state." },

    // --- World state (right column) ---
    { id:"quests", kind:"write", label:"Quests & Status", sub:"quests, HP, score, time",
      x:580, y:-46, w:300, h:74,
      summary:"Global game state the narrator drives: active quests and objectives, the player's health and points, the story clock, flags, and the current goal.",
      note:"Progression and status via the toolset: start_quest / update_objective / complete_quest / fail_quest, apply_damage / heal, award_points, advance_time, set_flag, set_goal, set_game_status." },
    { id:"scene", kind:"scene", label:"Scene", sub:"the current place",
      x:885, y:116, w:240, h:80,
      summary:"The current place. Created and furnished by the narrator; holds the present cast, items, and exits.",
      note:"A scene is the live container for the turn: its cast, items, and exits are what the narrator and routers read and mutate." },
    { id:"character", kind:"character", label:"Character", sub:"its own agent, private memory",
      x:885, y:460, w:240, h:80,
      summary:"Each character is its own agent with private memory. Replies when cued, can whisper privately, carries an inventory, and can follow you between scenes.",
      note:"Characters run as independent agents: they reply only when cued, keep private memory, and persist following/relation across scenes." },
    { id:"items", kind:"contains", label:"Inventory/Items", sub:"scene loot & props",
      x:1195, y:40, w:240, h:74,
      summary:"Scene loot and props. Deterministic take router: a take verb + the item name picks it up, model-independent.",
      note:"Picking up is deterministic: a take verb plus the item name routes engine-side, no model call required." },
    { id:"exits", kind:"contains", label:"Exits", sub:"revealed ways out",
      x:1195, y:120, w:240, h:74,
      summary:"Revealed ways out. Deterministic move router: 'go to <label>' transitions you, no model needed.",
      note:"Movement is deterministic: 'go to <label>' is matched by the move router and transitions the scene with no model call." },
    { id:"sceneActions", kind:"contains", label:"Actions", sub:"offered & custom (e.g. search)",
      x:1195, y:200, w:240, h:74,
      summary:"Contextual scene actions the narrator offers (search, examine, use) plus custom one-off actions, surfaced as buttons via offer_action / offer_scene_action. Distinct from the player's say/do/look segments.",
      note:"Scene-level offered actions: the narrator can surface contextual or custom action buttons (search, examine, use) through offer_action / offer_scene_action." },
    { id:"inventory", kind:"contains", label:"Inventory/Items", sub:"what a character carries",
      x:1195, y:320, w:240, h:74,
      summary:"What a character carries. Give and take are deterministic engine-side.",
      note:"A character's carried items; give and take resolve deterministically engine-side." },
    { id:"characterActions", kind:"contains", label:"Actions", sub:"offered (give, follow, custom)",
      x:1195, y:416, w:240, h:72,
      summary:"Per-character offered actions, like give, ask to follow, and custom one-off actions, surfaced as buttons via offer_action.",
      note:"A character exposes its own offered actions (give, ask to follow, use, custom) through offer_action, alongside say/do/whisper." },
    { id:"whisper", kind:"talks", label:"Whisper", sub:"private 1:1",
      x:1195, y:512, w:240, h:80,
      summary:"Private 1:1 with a character, never shown to the rest of the scene. A whisper runs no narrator pass; the character records confided past via its own share_past tool.",
      note:"A whisper bypasses the narrator entirely: it is a direct 1:1 turn where the character may call share_past to record what was confided." },
    { id:"memory", kind:"talks", label:"Memory", sub:"private, per-character",
      x:1195, y:608, w:240, h:72,
      summary:"Each character keeps private memory that the profile surfaces: their backstory, unlocked traits, and lived moments. A rolling recap keeps it bounded so context stays in budget.",
      note:"Private per-character memory: backstory (origin), traits, and moments. The profile shows the revealed pieces; a rolling recap keeps context bounded." },
    { id:"backstory", kind:"talks", label:"Backstory", sub:"origin / their past",
      x:1505, y:528, w:230, h:72,
      summary:"The character's origin, the 'Their Past' list. Revealed piece by piece as you learn it (reveal_origin in public turns, share_past in whispers), each stamped with the story clock.",
      note:"Origin facts surface on the profile only as the player learns them, tagged with when (LEARNED: DAY 1, ...)." },
    { id:"traits", kind:"talks", label:"Traits", sub:"unlocked through play",
      x:1505, y:608, w:230, h:72,
      summary:"Personality traits earned through play (note_trait / admit_trait), each stamped with the story clock. Not preset at creation.",
      note:"Traits are earned by a real moment, not assigned up front; the narrator or the character records them sparingly." },
    { id:"events", kind:"talks", label:"Memories / Events", sub:"moments lived",
      x:1505, y:688, w:230, h:72,
      summary:"Notable moments the character lived through (mark_moment / note_moment): what happened between you, kept in their memory and feeding later reactions.",
      note:"Moments record lived events between the character and the player, feeding their memory and later reactions." },

    // --- Player turn, stackable (bottom-left lane) ---
    { id:"actions", kind:"flow", label:"Possible Actions", sub:"composed from segments",
      x:470, y:470, w:300, h:84,
      summary:"A turn's composed action, built from stackable segments. Freeform typing is interpreted into the same directed segments as the buttons.",
      note:"Both buttons and freeform text resolve into the same directed segments; the interpreter normalizes typing into the identical composed action." },
    { id:"say", kind:"call", label:"say", sub:"speak",
      x:600, y:610, w:150, h:72,
      summary:"Speak. Addressing a present character by name deterministically cues them to reply.",
      note:"Naming a present character in a say deterministically cues that character to reply." },
    { id:"do", kind:"call", label:"do", sub:"act",
      x:420, y:610, w:150, h:72,
      summary:"Act. Matched against deterministic routers (move, take) first; otherwise narrated.",
      note:"A do is tried against the move and take routers first; only unmatched actions reach the narrator." },
    { id:"look", kind:"call", label:"look", sub:"inspect the scene",
      x:190, y:610, w:150, h:72,
      summary:"Inspect the scene. Triggers a scene render on the image model (off by default on the Anna build).",
      note:"Look requests a scene render from the image model, which is disabled by default on the Anna build." },
    { id:"custom", kind:"call", label:"custom", sub:"offered / custom action",
      x:780, y:610, w:160, h:72,
      summary:"A custom or offered action button. Selecting it stacks a custom action onto the turn, the offered counterpart to say/do/look.",
      note:"Custom and offered actions (from offer_action) stack onto the composed turn just like say/do/look." }
  ],
  edges:[
    { from:"annaText", to:"narrator", kind:"anna", label:"tokens (sampling)",
      detail:"Every narrator token is generated by reverse-RPC sampling/createMessage against Anna's host model; the engine streams the result back into the turn." },
    { from:"annaImage", to:"narrator", kind:"image", label:"image_request",
      detail:"When images are enabled, the narrator's show_image tool issues an image/generate request to Anna's host image model and the render returns out-of-band." },
    { from:"narrator", to:"tools", kind:"tool", label:"drives state via",
      detail:"The narrator changes nothing directly; every state mutation is a validated call into the narrator toolset (the only sanctioned path to state)." },
    { from:"narrator", to:"scene", kind:"write", label:"creates & furnishes",
      detail:"describe_scene / add_exit / place_item and friends create the scene and furnish it with cast, items, and exits." },
    { from:"narrator", to:"quests", kind:"write", label:"tracks",
      detail:"The narrator drives progression and status, quests, objectives, HP, score, time, flags, through its toolset." },
    { from:"scene", to:"character", kind:"contains", label:"contains (present cast)",
      detail:"The scene holds the present cast; spawn_character adds to it and kill_character removes from it." },
    { from:"scene", to:"items", kind:"contains", label:"contains", fromSide:"r", toSide:"l",
      detail:"Loot and props placed in the scene; reveal_item exposes them and the take router picks them up." },
    { from:"scene", to:"exits", kind:"contains", label:"contains", fromSide:"r", toSide:"l",
      detail:"Revealed ways out of the scene; add_exit creates them and the move router transitions through them." },
    { from:"scene", to:"sceneActions", kind:"contains", label:"contains", fromSide:"r", toSide:"l",
      detail:"Offered and custom scene actions (search, examine, use) surfaced as buttons via offer_action / offer_scene_action." },
    { from:"character", to:"inventory", kind:"contains", label:"carries", fromSide:"r", toSide:"l",
      detail:"Each character carries an inventory; give_item and the take router move items in and out deterministically." },
    { from:"character", to:"characterActions", kind:"contains", label:"offers", fromSide:"r", toSide:"l",
      detail:"A character exposes offered actions (give, ask to follow, custom) surfaced via offer_action." },
    { from:"character", to:"whisper", kind:"talks", label:"private 1:1", fromSide:"r", toSide:"l",
      detail:"A character can be whispered to privately; that turn runs no narrator pass and the character may record it via share_past." },
    { from:"character", to:"memory", kind:"talks", label:"remembers", fromSide:"r", toSide:"l",
      detail:"Each character keeps private memory: backstory, traits, and lived moments, bounded by a rolling recap." },
    { from:"memory", to:"backstory", kind:"talks", label:"origin", fromSide:"r", toSide:"l",
      detail:"The character's origin / 'Their Past', revealed piece by piece via reveal_origin / share_past." },
    { from:"memory", to:"traits", kind:"talks", label:"earned", fromSide:"r", toSide:"l",
      detail:"Personality traits earned through play via note_trait / admit_trait." },
    { from:"memory", to:"events", kind:"talks", label:"lived", fromSide:"r", toSide:"l",
      detail:"Notable moments the character lived through via mark_moment / note_moment." },
    { from:"character", to:"narrator", kind:"talks", label:"replies / interacts",
      detail:"When cued, a character replies in its own voice; its reply and any character-tool actions feed back into the turn the narrator adjudicates." },
    { from:"character", to:"scene", kind:"flow", label:"follows to next scene",
      detail:"set_following makes a character follow the player; on a move the follower is carried into the next scene." },
    { from:"actions", to:"narrator", kind:"feed", label:"composed action feeds",
      detail:"The composed action (stacked segments) is fed to the narrator as the player's turn input." },
    { from:"actions", to:"character", kind:"cue", label:"cues a present character",
      detail:"Addressing a present character within the composed action cues that character to reply on this turn." },
    { from:"say", to:"actions", kind:"flow", label:"stack",
      detail:"A say segment stacks onto the turn's composed action." },
    { from:"do", to:"actions", kind:"flow", label:"stack",
      detail:"A do segment stacks onto the turn's composed action." },
    { from:"look", to:"actions", kind:"flow", label:"stack",
      detail:"A look segment stacks onto the turn's composed action." },
    { from:"custom", to:"actions", kind:"flow", label:"stack",
      detail:"A custom or offered action stacks onto the turn's composed action." },
    { from:"look", to:"annaImage", kind:"image", label:"renders the scene",
      detail:"A look triggers a scene render on Anna's host image model (off by default on the Anna build)." }
  ]
};

/* ---------- small helpers ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function chips(items){ return (!items||!items.length)?'<p>None.</p>':'<div class="chips">'+items.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>'; }
function highlightJson(v){
  const j=JSON.stringify(v,null,2);
  return j.replace(/("(?:\\.|[^"\\])*")(\s*:)?|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|\btrue\b|\bfalse\b|\bnull\b|[{}\[\]]/g,(m,str,colon)=>{
    if(str){const cls=colon?'jkey':'jstr';return '<span class="'+cls+'">'+esc(str)+'</span>'+esc(colon||'');}
    if(m==='{'||m==='}')return '<span class="jobj">'+m+'</span>';
    if(m==='['||m===']')return '<span class="jarr">'+m+'</span>';
    if(m==='true'||m==='false')return '<span class="jbool">'+m+'</span>';
    if(m==='null')return '<span class="jnull">null</span>';
    return '<span class="jnum">'+m+'</span>';
  });
}
function jsonBlock(v){ return '<pre class="jsonbox">'+highlightJson(v)+'</pre>'; }

/* ---------- DOM refs ---------- */
const svg=document.getElementById('chart'), viewport=document.getElementById('viewport'),
  edgeG=document.getElementById('edges'), labelG=document.getElementById('labels'),
  nodeG=document.getElementById('nodes'), laneG=document.getElementById('lanes'),
  defs=document.getElementById('defs'), tip=document.getElementById('tip'),
  panel=document.getElementById('panel'), stage=document.getElementById('stage');

let SEC=SECTION;     // the one section
let g=null;          // current graph state

/* ---------- graph engine (operates on g) ---------- */
function colorFor(k){ return (g.C&&g.C[k]) || Object.values(g.C)[0] || 'var(--muted)'; }
function edgeColor(k){ return (g.EDGE_KIND&&g.EDGE_KIND[k]) || (g.C&&g.C[k]) || 'var(--muted)'; }
function nodeFill(k){ return (g.NODE_FILL&&g.NODE_FILL[k]) || '#171410'; }

const _mid={};
function buildMarkers(){
  const colors=[...new Set(g.edges.map(e=>edgeColor(e.kind)))]; let html='';
  colors.forEach((c,i)=>{ const id='ar'+i; _mid[c]=id;
    html+='<marker id="'+id+'" markerWidth="6.5" markerHeight="6.5" refX="5.5" refY="3.25" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.5,3.25 L0,6.5 z" fill="'+c+'"></path></marker>'; });
  defs.innerHTML=html;
}
function markerFor(k){ return 'url(#'+(_mid[edgeColor(k)]||'ar0')+')'; }
function center(n){ return {x:n.x+n.w/2,y:n.y+n.h/2}; }
function boundaryPoint(a,b,side){
  const ac=center(a),bc=center(b),dx=bc.x-ac.x,dy=bc.y-ac.y,pad=12;
  if(side==='r'||side==='l'){
    const x=side==='r'?a.x+a.w:a.x;
    const y=ac.y+(dx?dy*((a.w/2)/Math.abs(dx)):0);
    return {x,y:Math.max(a.y+pad,Math.min(a.y+a.h-pad,y))};
  }
  if(side==='t'||side==='b'){
    const y=side==='b'?a.y+a.h:a.y;
    const x=ac.x+(dy?dx*((a.h/2)/Math.abs(dy)):0);
    return {x:Math.max(a.x+pad,Math.min(a.x+a.w-pad,x)),y};
  }
  const s=Math.max(Math.abs(dx)/(a.w/2),Math.abs(dy)/(a.h/2))||1;
  return {x:ac.x+dx/s,y:ac.y+dy/s};
}
function edgeEndpoints(e){ const a=g.byId.get(e.from),b=g.byId.get(e.to); return {from:boundaryPoint(a,b,e.fromSide),to:boundaryPoint(b,a,e.toSide)}; }
function edgeVector(e){ const {from,to}=edgeEndpoints(e); const dx=to.x-from.x,dy=to.y-from.y,len=Math.hypot(dx,dy)||1;
  return {from,to,ux:dx/len,uy:dy/len,nx:-dy/len,ny:dx/len,len}; }
function recipOffset(e){
  // separate reciprocal A->B / B->A arcs so they never overlap
  if(!g.recip.has(e.from+'|'+e.to)) return 0;
  return (e.from<e.to?1:-1)*22;
}
function pathFor(e){
  const {from:p1,to:p2}=edgeEndpoints(e);
  const dx=p2.x-p1.x, dy=p2.y-p1.y;
  const off=recipOffset(e);
  const v=edgeVector(e);
  const ox=v.nx*off, oy=v.ny*off; // perpendicular shove for reciprocals
  if(Math.abs(dx)>=Math.abs(dy)){ // horizontal-dominant: curve in x
    const bend=Math.max(28,Math.min(150,Math.abs(dx)*.38));
    const s=Math.sign(dx||1);
    return 'M '+p1.x+' '+p1.y+' C '+(p1.x+s*bend+ox)+' '+(p1.y+oy)+', '+(p2.x-s*bend+ox)+' '+(p2.y+oy)+', '+p2.x+' '+p2.y;
  } else { // vertical-dominant: curve in y (no sideways bulge)
    const bend=Math.max(28,Math.min(150,Math.abs(dy)*.38));
    const s=Math.sign(dy||1);
    return 'M '+p1.x+' '+p1.y+' C '+(p1.x+ox)+' '+(p1.y+s*bend+oy)+', '+(p2.x+ox)+' '+(p2.y-s*bend+oy)+', '+p2.x+' '+p2.y;
  }
}
function labelPos(e){ const a=center(g.byId.get(e.from)),b=center(g.byId.get(e.to)),v=edgeVector(e),o=42+recipOffset(e);
  return {x:(a.x+b.x)/2+v.nx*o,y:(a.y+b.y)/2+v.ny*o-7}; }
function relatedSet(){
  const set={nodes:new Set(),edges:new Set()};
  if(g.selected==null){ g.nodes.forEach(n=>set.nodes.add(n.id)); g.edges.forEach((_,i)=>set.edges.add(i)); return set; }
  set.nodes.add(g.selected);
  g.edges.forEach((e,i)=>{ if(e.from===g.selected||e.to===g.selected){set.edges.add(i);set.nodes.add(e.from);set.nodes.add(e.to);} });
  return set;
}
function render(){
  viewport.setAttribute('transform','translate('+g.t.x+' '+g.t.y+') scale('+g.t.k+')');
  laneG.innerHTML=''; edgeG.innerHTML=''; labelG.innerHTML=''; nodeG.innerHTML='';
  const maxX=Math.max(...g.nodes.map(n=>n.x+n.w))+120, minX=Math.min(-10,Math.min(...g.nodes.map(n=>n.x))-80);
  (g.lanes||[]).forEach(L=>{
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('class','laneLine'); ln.setAttribute('x1',minX); ln.setAttribute('x2',maxX); ln.setAttribute('y1',L.y); ln.setAttribute('y2',L.y);
    laneG.appendChild(ln);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','laneLabel'); t.setAttribute('x',minX+14); t.setAttribute('y',L.y-10); t.textContent=L.label; laneG.appendChild(t);
  });
  const rel=relatedSet();
  g.edges.forEach((e,i)=>{
    const active=g.selectedEdge===i||g.selected==null||rel.edges.has(i);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','edge'+(active?'':' dim')+(g.selectedEdge===i?' selected':''));
    p.setAttribute('d',pathFor(e)); p.setAttribute('stroke',edgeColor(e.kind)); p.setAttribute('marker-end',markerFor(e.kind));
    p.addEventListener('click',ev=>{ev.stopPropagation();selectEdge(i);});
    edgeG.appendChild(p);
    const v=edgeVector(e), off=recipOffset(e), ox=v.nx*off, oy=v.ny*off;
    const od=document.createElementNS('http://www.w3.org/2000/svg','circle');
    od.setAttribute('class','edgePort'+(active?'':' dim')); od.setAttribute('cx',v.from.x+ox); od.setAttribute('cy',v.from.y+oy);
    od.setAttribute('r',g.selectedEdge===i?5:3.8); od.setAttribute('stroke',edgeColor(e.kind)); edgeG.appendChild(od);
    const ir=document.createElementNS('http://www.w3.org/2000/svg','circle');
    ir.setAttribute('class','edgePort'+(active?'':' dim')); ir.setAttribute('cx',v.to.x+ox); ir.setAttribute('cy',v.to.y+oy);
    ir.setAttribute('r',g.selectedEdge===i?7:5.3); ir.setAttribute('fill','transparent'); ir.setAttribute('stroke',edgeColor(e.kind)); edgeG.appendChild(ir);
    const showL=g.selectedEdge===i||(g.selected!=null&&rel.edges.has(i))||e.kind===g.FLOW_KIND;
    const lp=labelPos(e);
    const lab=document.createElementNS('http://www.w3.org/2000/svg','text');
    lab.setAttribute('class','edgeLabel'+(showL?(active?'':' dim'):' hidden')); lab.setAttribute('x',lp.x); lab.setAttribute('y',lp.y);
    lab.setAttribute('text-anchor','middle'); lab.textContent=e.from+' -> '+e.to+': '+e.label; labelG.appendChild(lab);
    if(showL){
      const ot=document.createElementNS('http://www.w3.org/2000/svg','text');
      ot.setAttribute('class','edgePortText'+(active?'':' dim')); ot.setAttribute('x',v.from.x+ox+v.ux*26+v.nx*14); ot.setAttribute('y',v.from.y+oy+v.uy*26+v.ny*14);
      ot.setAttribute('text-anchor','middle'); ot.textContent='OUT'; labelG.appendChild(ot);
      const it=document.createElementNS('http://www.w3.org/2000/svg','text');
      it.setAttribute('class','edgePortText'+(active?'':' dim')); it.setAttribute('x',v.to.x+ox-v.ux*26+v.nx*14); it.setAttribute('y',v.to.y+oy-v.uy*26+v.ny*14);
      it.setAttribute('text-anchor','middle'); it.textContent='IN'; labelG.appendChild(it);
    }
  });
  g.nodes.forEach(n=>{
    const grp=document.createElementNS('http://www.w3.org/2000/svg','g');
    const seld=g.selected===n.id, conn=g.selected==null||rel.nodes.has(n.id);
    grp.setAttribute('class','node '+(seld?'selected':'')+' '+(conn?'connected':'dim')); grp.setAttribute('transform','translate('+n.x+' '+n.y+')');
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('class','main'); r.setAttribute('width',n.w); r.setAttribute('height',n.h);
    r.setAttribute('fill',nodeFill(n.kind)); r.setAttribute('stroke',colorFor(n.kind)); grp.appendChild(r);
    const kd=document.createElementNS('http://www.w3.org/2000/svg','text');
    kd.setAttribute('class','kind'); kd.setAttribute('x',14); kd.setAttribute('y',19); kd.setAttribute('fill',colorFor(n.kind)); kd.textContent=n.kind; grp.appendChild(kd);
    const lb=document.createElementNS('http://www.w3.org/2000/svg','text');
    lb.setAttribute('class','label'); lb.setAttribute('x',14); lb.setAttribute('y',42); lb.textContent=n.label; grp.appendChild(lb);
    const sb=document.createElementNS('http://www.w3.org/2000/svg','text');
    sb.setAttribute('class','sub'); sb.setAttribute('x',14); sb.setAttribute('y',62); sb.textContent=n.sub; grp.appendChild(sb);
    [{k:'what',l:'?',x:n.w-74,w:18},{k:'how',l:'H',x:n.w-51,w:18},{k:'io',l:'IO',x:n.w-28,w:22}].forEach(b=>{
      const bg=document.createElementNS('http://www.w3.org/2000/svg','g'); bg.setAttribute('class','helpBtn'); bg.setAttribute('transform','translate('+b.x+' 10)');
      const rr=document.createElementNS('http://www.w3.org/2000/svg','rect'); rr.setAttribute('width',b.w); rr.setAttribute('height',18); bg.appendChild(rr);
      const tt=document.createElementNS('http://www.w3.org/2000/svg','text'); tt.setAttribute('x',b.w/2); tt.setAttribute('y',12.5); tt.setAttribute('text-anchor','middle'); tt.setAttribute('fill',colorFor(n.kind)); tt.textContent=b.l; bg.appendChild(tt);
      bg.addEventListener('pointerdown',ev=>ev.stopPropagation());
      bg.addEventListener('click',ev=>{ev.stopPropagation();showHelp(ev,n,b.k);});
      grp.appendChild(bg);
    });
    grp.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); g.drag={id:n.id,start:screenToWorld(ev),ox:n.x,oy:n.y,moved:false}; try{grp.setPointerCapture(ev.pointerId);}catch(_){}});
    grp.addEventListener('pointermove',ev=>{ if(!g.drag||g.drag.id!==n.id)return; const p=screenToWorld(ev),dx=p.x-g.drag.start.x,dy=p.y-g.drag.start.y;
      if(Math.abs(dx)+Math.abs(dy)>2)g.drag.moved=true; n.x=g.drag.ox+dx; n.y=g.drag.oy+dy; render(); });
    grp.addEventListener('pointerup',()=>{ if(!g.drag||g.drag.id!==n.id)return; const moved=g.drag.moved; g.drag=null; if(!moved)selectNode(n.id); });
    nodeG.appendChild(grp);
  });
}

/* ---------- selection -> panel ---------- */
function selectNode(id){ hideHelp(); g.selected=id; g.selectedEdge=null; openPanel(nodeDetail(g.byId.get(id))); centerInLeft(g.byId.get(id)); render(); }
function selectEdge(i){ hideHelp(); g.selectedEdge=i; g.selected=null; openPanel(edgeDetail(g.edges[i])); render(); }
function nodeJson(n){ return {id:n.id, kind:n.kind, label:n.label, summary:n.summary}; }
function nodeDetail(n){
  let h='<div class="section"><h3>JSON shape</h3>'+jsonBlock(nodeJson(n))+'</div>';
  h+='<div class="section"><h3>Key point</h3><p>'+esc(n.note||'-')+'</p></div>';
  h+='<div class="section"><h3>Connected edges</h3>'+chips((SEC.edges||[]).filter(e=>e.from===n.id||e.to===n.id).map(e=>e.from+' -> '+e.to+': '+e.label))+'</div>';
  return {kind:n.kind,title:n.label,summary:n.summary,html:h};
}
function edgeDetail(e){
  const a=g.byId.get(e.from),b=g.byId.get(e.to);
  const h='<div class="section"><h3>JSON edge</h3>'+jsonBlock({edge:{from:e.from,to:e.to,kind:e.kind,label:e.label,source_shape:nodeJson(a),target_shape:nodeJson(b)}})+'</div>'+
    '<div class="section"><h3>Direction</h3><p><span class="code">'+esc(e.from)+'</span> sends <span class="code">'+esc(e.label)+'</span> into <span class="code">'+esc(e.to)+'</span>. Dot = OUT, ring + arrowhead = IN.</p></div>'+
    '<div class="section"><h3>Meaning</h3><p>'+esc(e.detail)+'</p></div>'+
    '<div class="section"><h3>Source</h3><p><span class="code">'+esc(e.from)+'</span> - '+esc(a.summary)+'</p></div>'+
    '<div class="section"><h3>Target</h3><p><span class="code">'+esc(e.to)+'</span> - '+esc(b.summary)+'</p></div>';
  return {kind:e.kind+' edge',title:a.label+' -> '+b.label,summary:e.detail,html:h};
}
function openPanel(d){
  document.getElementById('pKind').textContent=d.kind;
  document.getElementById('pTitle').textContent=d.title;
  document.getElementById('pSummary').textContent=d.summary;
  document.getElementById('panelBody').innerHTML=d.html;
  panel.classList.add('open');
}
function closePanel(){ panel.classList.remove('open'); if(g){ g.selected=null; g.selectedEdge=null; render(); } }
document.getElementById('pClose').addEventListener('click',closePanel);

function centerInLeft(n){
  // keep the selected node in the visible left ~45% when the 50% panel opens
  const r=svg.getBoundingClientRect(); if(!r.width) return;
  g.t.x=r.width*0.24 - (n.x+n.w/2)*g.t.k;
  g.t.y=r.height*0.5 - (n.y+n.h/2)*g.t.k;
}

/* ---------- help tip ---------- */
function nodeFlow(id){
  const i=g.edges.filter(e=>e.to===id).map(e=>e.from+': '+e.label), o=g.edges.filter(e=>e.from===id).map(e=>e.to+': '+e.label);
  return {i:i.length?i:['none'],o:o.length?o:['none']};
}
function showHelp(ev,n,kind){
  let title='What is?',body=n.summary;
  if(kind==='how'){title='How works?';body=n.note||n.summary;}
  else if(kind==='io'){title='Info in / out';const f=nodeFlow(n.id);body='IN: '+f.i.slice(0,3).join('; ')+'. OUT: '+f.o.slice(0,3).join('; ')+'.';}
  tip.innerHTML='<strong>'+esc(n.label)+' - '+esc(title)+'</strong><p>'+esc(body)+'</p>';
  const w=stage.getBoundingClientRect();
  tip.style.left=Math.max(10,Math.min(ev.clientX-w.left+12,w.width-332))+'px';
  tip.style.top=Math.max(10,Math.min(ev.clientY-w.top+12,w.height-120))+'px';
  tip.style.display='block';
}
function hideHelp(){ tip.style.display='none'; }

/* ---------- pan / zoom ---------- */
function screenToWorld(ev){ const r=svg.getBoundingClientRect(); return {x:(ev.clientX-r.left-g.t.x)/g.t.k,y:(ev.clientY-r.top-g.t.y)/g.t.k}; }
function isInteractive(t){ return t&&t.closest&&(t.closest('.node')||t.classList.contains('edge')); }
svg.addEventListener('pointerdown',ev=>{ if(isInteractive(ev.target))return; hideHelp(); g.pan={x:ev.clientX,y:ev.clientY,tx:g.t.x,ty:g.t.y}; svg.classList.add('dragging'); });
svg.addEventListener('pointermove',ev=>{ if(!g.pan)return; g.t.x=g.pan.tx+ev.clientX-g.pan.x; g.t.y=g.pan.ty+ev.clientY-g.pan.y; render(); });
svg.addEventListener('pointerup',()=>{ g&&(g.pan=null); svg.classList.remove('dragging'); });
svg.addEventListener('pointerleave',()=>{ g&&(g.pan=null); svg.classList.remove('dragging'); });
svg.addEventListener('click',ev=>{ if(isInteractive(ev.target))return; hideHelp(); closePanel(); });
svg.addEventListener('wheel',ev=>{ ev.preventDefault(); const r=svg.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  const bx=(mx-g.t.x)/g.t.k,by=(my-g.t.y)/g.t.k,sc=Math.exp(-ev.deltaY*.0012);
  g.t.k=Math.max(.16,Math.min(1.8,g.t.k*sc)); g.t.x=mx-bx*g.t.k; g.t.y=my-by*g.t.k; render(); },{passive:false});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape')closePanel(); });

function fit(){
  const pad=70,top=70; const minX=Math.min(...g.nodes.map(n=>n.x)),minY=Math.min(...g.nodes.map(n=>n.y));
  const maxX=Math.max(...g.nodes.map(n=>n.x+n.w)),maxY=Math.max(...g.nodes.map(n=>n.y+n.h));
  const r=svg.getBoundingClientRect(); const k=Math.min((r.width-pad*2)/(maxX-minX),(r.height-top-pad)/(maxY-minY));
  g.t.k=Math.max(.16,Math.min(1.2,k||.5)); g.t.x=pad-minX*g.t.k; g.t.y=top-minY*g.t.k; render();
}
function home(){ g.t={...(g.home||{x:60,y:80,k:.5})}; render(); }
document.getElementById('fit').onclick=fit;
document.getElementById('reset').onclick=()=>{ g.orig.forEach(p=>{const n=g.byId.get(p.id);n.x=p.x;n.y=p.y;}); closePanel(); fit(); };

/* ---------- boot straight into the single graph ----------
   Adapted from the docs' initGraph: there is no multi-section state here, so
   selectSection / buildNav / applyMode / setMode are dropped and we just
   wire the one SECTION into g and fit it. */
function initGraph(sec){
  g={ ...sec, byId:new Map(sec.nodes.map(n=>[n.id,n])), selected:null, selectedEdge:null, drag:null, pan:null,
      t:{...(sec.home||{x:60,y:80,k:.5})}, orig:sec.nodes.map(n=>({id:n.id,x:n.x,y:n.y})),
      recip:new Set() };
  const pairs=new Set(sec.edges.map(e=>e.from+'|'+e.to));
  sec.edges.forEach(e=>{ if(pairs.has(e.to+'|'+e.from)) g.recip.add(e.from+'|'+e.to); });
  buildMarkers();
  document.getElementById('legend').innerHTML=(sec.legend||[]).map(l=>'<span class="pill"><i class="dot" style="background:'+l.color+'"></i>'+esc(l.label)+'</span>').join('');
  fit();
}

initGraph(SECTION);
window.addEventListener('resize',()=>{ if(g) render(); });
</script>
</body>
