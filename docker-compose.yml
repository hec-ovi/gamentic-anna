# Gamentic on Anna: ONE container, fully native, no bridge, no GPU.
#
# Inside it, `anna-app dev` (Anna's own dev runtime) hosts the gamentic iframe on
# :5180 and spawns the gamentic executa. The executa reverse-RPCs the Anna host for
# LLM text and images; the model, billing and quota are owned by Anna. Nothing of
# ours bridges anything.
#
# Isolation: named volumes only (no host folders touched), port bound to 127.0.0.1.
# First run:
#   docker compose up -d --build
#   docker exec -it gamentic-anna anna-app login --host https://anna.partners --no-browser
#   # complete the device-code once; the PAT persists on the anna-cred volume
# Then play at http://localhost:5180. Full teardown: docker compose down -v
name: gamentic-anna

services:
  gamentic:
    build:
      context: .
      dockerfile: infra/Dockerfile
    image: gamentic-anna:latest
    pull_policy: build
    container_name: gamentic-anna
    restart: unless-stopped
    environment:
      - ANNA=true                       # silences voice (Anna has no TTS); text goes native
      # Images ON: renders run detached (never inside the invoke, whose manifest timeout
      # is 600s anyway), two at a time on the Anna ambient lane, deduped by in-flight
      # claims, and delivered as small /media refs the iframe pulls once via /media64.
      - IMAGE_ENABLED=true
      - IMAGE_ITEMS=true
      - SUMMARY_ENABLED=false
      - CHAR_SUMMARY_ENABLED=false
    volumes:
      - anna-cred:/root/.config/anna    # the Anna login PAT; run `anna-app login` once
      - game-data:/data/game            # SQLite game DB
    ports:
      - "127.0.0.1:${APP_PORT:-5180}:5180"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:5180/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  anna-cred:   # Anna login PAT (sign in once)
  game-data:   # game DB
