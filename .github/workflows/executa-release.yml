name: executa-release

# Build the gamentic Executa binary for every platform Anna may install it on and
# publish them to a GitHub Release. The release tag (executa-v<version>) must match
# the binary_urls in backend/executa.json. After this runs, `anna-app executa publish`
# records the distribution and `anna-app apps cut` mirrors the assets into Anna R2.
#
# Trigger manually: gh workflow run executa-release.yml -f version=0.2.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: Executa version (also the release tag suffix)
        required: true
        default: "0.2.0"

permissions:
  contents: write   # create the Release + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest    # linux-x86_64
          - os: macos-14         # darwin-arm64
          - os: macos-15         # darwin-x86_64 (Rosetta)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build binary
        run: bash packaging/build-binary.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: executa-${{ matrix.os }}
          path: backend/dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "executa-v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "Executa v${{ inputs.version }}" \
            --notes "gamentic Executa binaries for the Anna binary distribution profile." \
            artifacts/* || gh release upload "executa-v${{ inputs.version }}" artifacts/* --clobber
