; Gamentic-on-Anna: one container, three processes, all on container-localhost.
; supervisord forwards its (container) environment to every child, so the
; user-overridable vars (ANNA_TEXT_MODEL, ANNA_IMAGE_VIA_COPILOT, credentials)
; flow through from compose; only the wiring that is fixed in-container is set
; explicitly per program below.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; control socket so `docker exec <c> supervisorctl status` works for managing
; / restarting the three processes from outside.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:anna-agent]
; The Anna backend (vendor binary). HOME holds its state on the anna-data volume;
; the one-time sign-in at :19001 persists there.
command=/opt/anna/Anna
directory=/opt/anna
environment=HOME="/data/anna"
autorestart=true
startretries=20
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:anna-api]
; OpenAI-compatible face over the agent's copilot. Reads the signed-in session
; from the agent's state dir (same volume); internal only (no published port).
command=/app/anna-api/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 9100
directory=/app/anna-api
environment=ANNA_AGENT_URL="http://127.0.0.1:19001",ANNA_AGENT_STATE_DIR="/data/anna/.matrix"
autorestart=true
startretries=20
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:anna-app]
; The Anna UI runner: gamentic iframe + the engine Executa (stdio child). The
; engine calls the LLM at anna-api on localhost. --no-watch: the harness watcher
; otherwise hot-reloads the iframe and resets the game.
command=anna-app dev --manifest manifest.json --bundle ./frontend --executa dir=./backend --port 5180 --no-llm --no-watch
directory=/app
environment=ANNA="true",ANNA_BASE_URL="http://127.0.0.1:9100",DB_PATH="/data/game/gamentic.db",IMAGE_ENABLED="true",SUMMARY_ENABLED="false",CHAR_SUMMARY_ENABLED="false"
autorestart=true
startretries=20
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
